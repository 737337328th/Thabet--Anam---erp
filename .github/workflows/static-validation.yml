name: Static validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile Python
        run: python -m compileall -q thabet_anam_v4
      - name: Validate JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for p in Path(".").rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
          print("JSON OK")
          PY
      - name: Validate pyproject
        run: python -c "import tomllib; tomllib.load(open('pyproject.toml','rb')); print('pyproject OK')"
      - name: Validate deployment scripts
        run: |
          bash -n deploy/oracle/*.sh
          bash -n deploy/free_local/*.sh
      - name: Validate Windows launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "deploy/free_local/START_WINDOWS.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Repository integrity check
        run: python scripts/repo_integrity_check.py
      - name: Ensure secrets are not committed
        run: test ! -f deploy/oracle/.secrets
      - name: Financial safety guard
        run: python scripts/financial_safety_guard.py

      - name: Frappe Cloud pure ERPNext guard
        run: python scripts/frappe_cloud_pure_erpnext_guard.py
