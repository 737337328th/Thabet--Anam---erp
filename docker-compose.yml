services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thabet_anam}
      POSTGRES_USER: ${POSTGRES_USER:-thabet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thabet} -d ${POSTGRES_DB:-thabet_anam}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-thabet}:${POSTGRES_PASSWORD:-change-this-password}@db:5432/${POSTGRES_DB:-thabet_anam}
      THABET_SECRET: ${THABET_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  pgdata:
